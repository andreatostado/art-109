
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Crosswalk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background image -->
    <img src="media/crosswalk.jpg"
         alt="Crosswalk"
         class="fullscreen-img">

    <!-- Interactive PNG objects -->
    <img src="media/dogmom.png" class="object object1" data-label="OBJECT 01">
    <img src="media/man.png" class="object object2" data-label="OBJECT 02">
    <img src="media/man1.png" class="object object3" data-label="OBJECT 03">
    <img src="media/mother.png" class="object object4" data-label="OBJECT 04">
    <img src="media/old.png" class="object object5" data-label="OBJECT 05">
    <img src="media/people.png" class="object object6" data-label="OBJECT 06">
    <img src="media/person.png" class="object object7" data-label="OBJECT 07">
    <img src="media/bird.png" class="object object8" data-label="OBJECT 08">
    <img src="media/cat.png" class="object object9" data-label="OBJECT 09">
    <img src="media/duck.png" class="object object10" data-label="OBJECT 10">
    <img src="media/duckling.png" class="object object11" data-label="OBJECT 11">
    <img src="media/plane.png" class="object object12" data-label="OBJECT 12">
    <img src="media/vampire.png" class="object object13" data-label="OBJECT 13">

    <!-- Custom cursor -->
    <div id="custom-cursor">EXPLORE</div>

    <script src="style.js"></script>

</body>
</html>
